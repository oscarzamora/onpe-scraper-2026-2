name: Probe ONPE desde GitHub Actions

# Solo se dispara manualmente desde la pestaña "Actions" del repo.
# No corre en push, no corre en cron, no toca archivos del repo.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Probamos en Ubuntu (default de Actions) y Windows para descartar
        # diferencias de TLS stack entre runners.
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout (sin LFS, sin submódulos)
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "curl_cffi>=0.7.0" "requests>=2.32.0"

      - name: Run probe
        run: python scripts/probe_github_actions.py
